<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#FAFAFA;font-family:Arial,Helvetica,sans-serif;color:#09090B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAFA;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E4E4E7;border-radius:16px;padding:32px;">
            <tr><td style="font-size:15px;font-weight:bold;padding-bottom:24px;">KolabReport</td></tr>
            <tr><td style="font-size:22px;font-weight:bold;line-height:1.3;padding-bottom:12px;">Confirmez votre adresse e-mail</td></tr>
            <tr><td style="font-size:15px;line-height:1.6;color:#3F3F46;padding-bottom:24px;">Bienvenue sur KolabReport. Cliquez sur le bouton ci-dessous pour confirmer votre adresse e-mail et activer votre compte.</td></tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/fr/auth/callback?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/fr/tableau-de-bord" style="display:inline-block;background:#09090B;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 24px;border-radius:999px;">Confirmer mon adresse</a>
              </td>
            </tr>
            <tr><td style="font-size:13px;line-height:1.6;color:#5F5F68;">Ce lien reste valable une heure. Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
