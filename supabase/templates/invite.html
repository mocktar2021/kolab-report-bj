<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#FAFAFA;font-family:Arial,Helvetica,sans-serif;color:#09090B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAFA;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E4E4E7;border-radius:16px;padding:32px;">
            <tr><td style="font-size:15px;font-weight:bold;padding-bottom:24px;">KolabReport</td></tr>
            <tr><td style="font-size:22px;font-weight:bold;line-height:1.3;padding-bottom:12px;">Vous êtes invité sur KolabReport</td></tr>
            <tr><td style="font-size:15px;line-height:1.6;color:#3F3F46;padding-bottom:24px;">Vous avez été invité à rejoindre un espace de travail KolabReport pour contribuer à un rapport d'expertise.</td></tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/fr/auth/callback?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/fr/reinitialiser-mot-de-passe" style="display:inline-block;background:#09090B;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 24px;border-radius:999px;">Accepter l'invitation</a>
              </td>
            </tr>
            <tr><td style="font-size:13px;line-height:1.6;color:#5F5F68;">Vous choisirez votre mot de passe à l'étape suivante. Ce lien reste valable une heure.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
