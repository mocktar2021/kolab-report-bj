name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Excluded from `supabase start`: nothing in the tests needs them and
  # each one adds an image to pull.
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the writing check can read every commit of the PR.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Writing check (commit messages and changed files)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format='%B' "$BASE_SHA..$HEAD_SHA" | sh scripts/check-prose.sh -
          git diff -z --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- \
            '*.ts' '*.tsx' '*.mts' '*.mjs' '*.js' '*.md' '*.sql' '*.html' '*.toml' '*.yml' '*.yaml' \
            | xargs -0 -r sh scripts/check-prose.sh

      - run: npm run format:check
      - run: npm run lint
      - name: No secrets in NEXT_PUBLIC_ variables
        run: node scripts/check-public-env.mjs
      - run: npm run typecheck
      - run: npm test

      - name: Audit production dependencies
        # Blocks on critical advisories. High and lower ones are tracked in Jira
        # and picked up by Dependabot.
        run: npm audit --omit=dev --audit-level=critical

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # Inlined at build time. Nothing calls Supabase during the build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  supabase:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        run: npx supabase start -x "$SUPABASE_EXCLUDE"

      - name: Apply every migration from scratch
        run: npx supabase db reset

      - name: pgTAP tests
        run: npx supabase test db

      - name: Generated types are up to date
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/lib/supabase/database.types.ts; then
            echo "::error file=src/lib/supabase/database.types.ts::Types are out of date. Run 'npm run db:types' with Supabase running and commit the result."
            exit 1
          fi

      - name: Point the app at the local stack
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.local
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "EMAIL_PROVIDER=mailpit"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
            echo "AI_PROVIDER=mock"
            echo "AI_DRAFTS_ENABLED=true"
            echo "AI_RATE_LIMIT_PER_HOUR=5"
          } >> .env.local

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Supabase logs
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep supabase_ | xargs -r -I{} sh -c 'echo "::group::{}"; docker logs --tail 200 {} 2>&1; echo "::endgroup::"'
