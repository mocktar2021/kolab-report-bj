name: CI

# What runs when (KRB-220, docs/ci.md): the end-to-end tests run on pull
# requests that are not drafts and every night on master, not after each
# merge. Lighthouse runs on Mondays and by hand. A push to master runs the
# checks and the build, then deploy.yml deploys staging.
on:
  pull_request:
    # ready_for_review: a draft skips the end-to-end tests, so marking it
    # ready runs them.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    # Each cron is named again in the jobs below: change both together.
    # Every night, the end-to-end tests, when master changed that day.
    - cron: "29 0 * * *"
    # Mondays, Lighthouse, when master changed that week.
    - cron: "47 0 * * 1"
  workflow_dispatch:
    inputs:
      lighthouse_only:
        # About 7 minutes instead of 25, to measure a branch before the merge
        # (KRB-172). Only off master: on master every job runs.
        description: Lighthouse only (not on master)
        type: boolean
        default: false

# A new push to the same pull request cancels the run that is still going.
# Scheduled runs have their own group, so they never wait on a push to
# master or replace one waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Excluded from `supabase start`: nothing in the tests needs them and
  # each one adds an image to pull. Realtime stays: the live dashboard test
  # (KRB-19) watches one browser update when another one saves.
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

jobs:
  changes:
    # Decides whether the end-to-end and Lighthouse jobs run (KRB-190). They
    # are skipped with an if:, not with paths-ignore on the workflow: a
    # skipped job counts as passed for a required check, while a workflow
    # that never starts leaves its checks pending and blocks the merge.
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its parents: on a PR, the merge into the base.
          fetch-depth: 2

      - name: Code or documentation only
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # A scheduled run goes on when master changed in the last day, or
          # the last week for the Monday one (170 hours).
          SINCE_HOURS: ${{ github.event.schedule == '47 0 * * 1' && '170' || '25' }}
        run: sh scripts/ci-changed-code.sh >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, unit tests, build
    # Not on a scheduled run: master passed them when each change was pushed.
    if: ${{ github.event_name != 'schedule' && !(inputs.lighthouse_only && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the writing check can read every commit of the PR.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Writing check (commit messages and changed files)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format='%B' "$BASE_SHA..$HEAD_SHA" | sh scripts/check-prose.sh -
          git diff -z --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- \
            '*.ts' '*.tsx' '*.mts' '*.mjs' '*.js' '*.md' '*.sql' '*.html' '*.toml' '*.yml' '*.yaml' \
            | xargs -0 -r sh scripts/check-prose.sh

      - run: npm run format:check
      - run: npm run lint
      - name: No secrets in NEXT_PUBLIC_ variables
        run: node scripts/check-public-env.mjs
      - run: npm run typecheck
      - run: npm test

      - name: Audit production dependencies
        # Blocks on high and critical advisories, except the reviewed ones in
        # .github/accepted-advisories.json (docs/security/dependencies.md).
        run: node scripts/audit-production.mjs

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # Inlined at build time. Nothing calls Supabase during the build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  supabase:
    name: Database and end-to-end tests
    needs: changes
    # On a pull request that is not a draft, every night on master and on a
    # manual run, not after a merge (KRB-220): the PR ran them already.
    # Skipped when only docs/ or Markdown files changed. Runs when the
    # changes job fails, so a broken check never skips the tests.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' && (
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'schedule' && github.event.schedule == '29 0 * * *') ||
      (github.event_name == 'workflow_dispatch' && !(inputs.lighthouse_only && github.ref != 'refs/heads/master'))
      ) }}
    runs-on: ubuntu-latest
    # 15 to 20 minutes with 151 tests on one worker, and 30% more on a slow
    # runner. Past 20 minutes on a normal runner, split the Playwright suite
    # in shards instead of raising this (KRB-188).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        run: npx supabase start -x "$SUPABASE_EXCLUDE"

      - name: Apply every migration from scratch
        run: npx supabase db reset

      - name: pgTAP tests
        run: npx supabase test db

      - name: Generated types are up to date
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/lib/supabase/database.types.ts; then
            echo "::error file=src/lib/supabase/database.types.ts::Types are out of date. Run 'npm run db:types' with Supabase running and commit the result."
            exit 1
          fi

      - name: Point the app at the local stack
        run: sh scripts/ci-env-local.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Supabase logs
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep supabase_ | xargs -r -I{} sh -c 'echo "::group::{}"; docker logs --tail 200 {} 2>&1; echo "::endgroup::"'

  lighthouse:
    # Its own job, next to the end-to-end one: both need about the same setup
    # time, so running in parallel adds no wall-clock time to CI. As a last
    # step of the end-to-end job it would add about 2.5 minutes to every run.
    # Mondays on master and on a manual run, which is how to check a PR
    # before the merge. Not on PRs (KRB-190) nor after each merge (KRB-220).
    # Skipped for documentation only.
    name: Lighthouse
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' && (
      (github.event_name == 'schedule' && github.event.schedule == '47 0 * * 1') ||
      github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        # Applies the migrations and supabase/seed.sql, whose demo user
        # Lighthouse signs in with.
        run: npx supabase start -x "$SUPABASE_EXCLUDE"

      - name: Point the app at the local stack
        run: sh scripts/ci-env-local.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse CI
        # Mobile, 5 runs on /fr/connexion and 5 on the signed-in
        # /fr/tableau-de-bord, each in its own Chrome. Fails under the KRB-25
        # scores (lighthouserc.cjs, docs/performance.md).
        run: sh scripts/lighthouse-ci.sh

      - name: Lighthouse scores
        # The score of every run, and what costs the most on the median run:
        # lhci only prints the assertions that fail (KRB-172).
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Dashboard trace
        # What the long tasks of the dashboard are made of, on manual
        # Lighthouse-only runs (KRB-172).
        if: ${{ !cancelled() && inputs.lighthouse_only }}
        run: |
          npm run start > /dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/fr/connexion && break; sleep 1; done
          profile=$(mktemp -d)
          node scripts/lighthouse-profile.mjs "$profile"
          LHCI_PROFILE="$profile" node scripts/lighthouse-trace.mjs http://localhost:3000/fr/tableau-de-bord

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore
