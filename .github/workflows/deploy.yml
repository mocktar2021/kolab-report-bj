name: Deploy

# Staging: after CI passes on master, migrations go to the staging Supabase
# project, then the app goes to Vercel. Production: on a v* tag or a manual
# run from master, same order.
# Nothing runs until the repository variable DEPLOY_ENABLED is "true".
# Setup and runbook: docs/deployment.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Pinned Vercel CLI, run with npx so it stays out of package.json.
  VERCEL_CLI: vercel@60.1.3

jobs:
  staging:
    name: Deploy to staging
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && github.ref == 'refs/heads/master')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    # Never cancel a run that may be halfway through a migration.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI just tested, not whatever master points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the environment settings
        run: sh scripts/check-deploy-env.sh

      - name: Link the staging Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List pending migrations
        run: |
          set -o pipefail
          {
            echo "### Staging migrations"
            echo '```'
            npx supabase db push --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        run: npx supabase db push

      - name: Build with the Preview settings (staging Supabase)
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")
          if [ -n "$STAGING_DOMAIN" ]; then
            npx --yes "$VERCEL_CLI" alias set "$url" "$STAGING_DOMAIN" --token="$VERCEL_TOKEN"
            url="https://$STAGING_DOMAIN"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging: $url" >> "$GITHUB_STEP_SUMMARY"

  release-plan:
    name: Check the release
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The commit is on master and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not on master. Only commits merged to master can go to production."
            exit 1
          fi
          for check in "Lint, typecheck, unit tests, build" "Database and end-to-end tests"; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq ".check_runs | map(select(.name == \"$check\")) | sort_by(.completed_at) | last | .conclusion")
            if [ "$conclusion" != "success" ]; then
              echo "::error::CI check \"$check\" is \"${conclusion:-missing}\" on $GITHUB_SHA."
              exit 1
            fi
          done

      - name: List the migrations in this release
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "### Production release of ${GITHUB_REF_NAME}"
            if [ -z "$previous" ]; then
              echo "First release: every migration in supabase/migrations will run."
            else
              echo "Migrations added since $previous:"
              echo '```'
              git diff --name-only --diff-filter=A "$previous" "$GITHUB_SHA" -- supabase/migrations || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy to production
    needs: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # With required reviewers on this environment (public repo or Enterprise),
    # the run waits here for approval.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the environment settings
        run: sh scripts/check-deploy-env.sh

      - name: Link the production Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations first
        run: |
          set -o pipefail
          {
            echo "### Production migrations"
            echo '```'
            npx supabase db push --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          npx supabase db push

      - name: Build with the Production settings
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
