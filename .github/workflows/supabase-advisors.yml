name: Supabase advisors

# Reads the security and performance advisors of each Supabase project every
# morning through the Management API (KRB-144) and prints a short table of
# lints by level. The job fails on any ERROR lint, so GitHub e-mails the
# failure. WARN and INFO lints are only listed. An environment without
# SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF gets a notice. The list of
# environments comes from the repository variable ADVISORS_ENVIRONMENTS
# (default staging and production). Runbook: docs/operations/monitoring.md.

on:
  schedule:
    # 06:23 UTC (08:23 or 07:23 in Paris), so a failure e-mail is there in the morning.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisors:
    name: Advisors (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.ADVISORS_ENVIRONMENTS || '["staging", "production"]') }}
    # Reading the advisors is not a deployment: no entry in the deployment
    # history. Required reviewers on an environment would still hold its run
    # (docs/operations/monitoring.md).
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      TARGET: ${{ matrix.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Read the advisors
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice title=Advisors skipped::No SUPABASE_ACCESS_TOKEN secret or SUPABASE_PROJECT_REF variable on the $TARGET environment."
            exit 0
          fi
          case "$SUPABASE_PROJECT_REF" in
            *[!a-z0-9]*)
              echo "::error title=Advisors ($TARGET)::SUPABASE_PROJECT_REF is not a project ref."
              exit 1
              ;;
          esac

          for kind in security performance; do
            # The token goes through stdin, not the command line.
            code=$(printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" \
              | curl -sS --retry 3 --retry-delay 10 --max-time 60 -H @- \
                -o "$RUNNER_TEMP/$kind.json" -w '%{http_code}' \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/$kind")
            if [ "$code" != "200" ]; then
              echo "::error title=Advisors ($TARGET)::The $kind advisors answered HTTP $code."
              exit 1
            fi
          done

          # One row per lint name and level: no object names, no details.
          jq -r -s '
            [ (.[0].lints[] | . + {kind: "security"}), (.[1].lints[] | . + {kind: "performance"}) ]
            | group_by([.kind, .level, .name])
            | map({kind: .[0].kind, level: .[0].level, name: .[0].name, count: length})
            | sort_by(({"ERROR": 0, "WARN": 1, "INFO": 2}[.level] // 3), .kind, .name)
            | .[] | "| \(.kind) | \(.name) | \(.level) | \(.count) |"
          ' "$RUNNER_TEMP/security.json" "$RUNNER_TEMP/performance.json" > "$RUNNER_TEMP/rows.md"
          errors=$(jq -s '[.[].lints[] | select(.level == "ERROR")] | length' \
            "$RUNNER_TEMP/security.json" "$RUNNER_TEMP/performance.json")

          {
            echo "### Supabase advisors on $TARGET"
            echo
            if [ -s "$RUNNER_TEMP/rows.md" ]; then
              echo "| Advisor | Lint | Level | Count |"
              echo "| --- | --- | --- | --- |"
              cat "$RUNNER_TEMP/rows.md"
            else
              echo "No lint."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::error title=Advisors ($TARGET)::$errors ERROR lint(s). Open Advisors in the Supabase dashboard of $TARGET for the objects and the fix."
            exit 1
          fi
